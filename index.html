<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIRU AI - Powered by Viruna Randinu</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<style>
:root{
  --bg:#0e0f10; --bg-elev:#17181a; --bg-elev2:#1f2123; --border:#2a2d30;
  --accent1:#5b8cff; --accent2:#e9678f; --accent3:#a786ff;
  --text:#e8e9ea; --text-dim:#9a9ea3; --gold:#f2b01f; --green:#10b981;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Google Sans','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);display:flex;height:100dvh;overflow:hidden;user-select:none;}
.app-container{display:flex;width:100%;height:100dvh;position:relative;}

/* Sidebar */
aside{width:280px;background:var(--bg-elev);display:flex;flex-direction:column;padding:16px;border-right:1px solid var(--border);transition:transform 0.3s ease;z-index:100;height:100%;}
.new-chat-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--accent1),var(--accent3));border:none;border-radius:24px;padding:13px 20px;color:#fff;font-weight:500;cursor:pointer;margin-bottom:20px;font-size:14px;width:fit-content;box-shadow:0 4px 14px rgba(91,140,255,.25);}
.new-chat-btn:hover{filter:brightness(1.1);}

.history-section{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-bottom:10px;}
.history-section::-webkit-scrollbar{width:4px;}
.history-section::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.history-title{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);padding:8px 12px;}

.history-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;color:var(--text);cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;position:relative;transition:background .15s;}
.history-item:hover,.history-item.active{background:var(--bg-elev2);}
.history-item span.title{flex:1;overflow:hidden;text-overflow:ellipsis;}
.history-item input.rename-input{flex:1;background:#0e0f10;border:1px solid var(--accent1);border-radius:6px;color:#fff;padding:3px 6px;font-size:13px;}
.icon-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;display:none;padding:2px;border-radius:4px;}
.history-item:hover .icon-btn{display:flex;}
.icon-btn:hover{color:#fff;}
.icon-btn.delete:hover{color:#ea4335;}

.sidebar-bottom{border-top:1px solid var(--border);padding-top:12px;margin-top:auto;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;color:var(--text-dim);cursor:pointer;font-size:14px;}
.sidebar-link:hover{background:var(--bg-elev2);color:var(--text);}

/* Main Content */
main{flex:1;display:flex;flex-direction:column;height:100dvh;background:var(--bg);position:relative;transition:all 0.3s ease;overflow:hidden;}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);height:65px;flex-shrink:0;}
.brand{font-size:20px;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
.menu-btn{color:var(--text-dim);cursor:pointer;margin-right:15px;display:none;}
.auth-status{display:flex;align-items:center;gap:10px;}
.owner-badge{background:linear-gradient(135deg,var(--gold),#f39c12);color:#131314;padding:5px 12px;border-radius:12px;font-size:12px;font-weight:bold;display:flex;align-items:center;gap:4px;}
.icon-only-btn{background:var(--bg-elev2);border:none;color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.icon-only-btn:hover{background:#2a2d30;}

/* Chat Area */
.chat-container{flex:1;overflow-y:auto;padding:20px 15%;display:flex;flex-direction:column;gap:28px;}
.chat-container::-webkit-scrollbar{width:8px;}
.chat-container::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.chat-row{display:flex;gap:16px;align-items:flex-start;max-width:850px;width:100%;margin:0 auto;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.user-avatar{background:var(--bg-elev2);color:#fff;font-weight:500;font-size:14px;}
.ai-avatar{background:linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3));color:#fff;}
.message-content{flex:1;font-size:15.5px;line-height:1.65;user-select:text;-webkit-user-select:text;}
.message-text-block{white-space:pre-wrap;margin-bottom:8px;}

/* Video Card & Progress Bar */
.video-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:380px;margin-top:10px;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.video-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:13px;color:var(--text-dim);}
.video-card-title{font-weight:bold;color:#38bdf8;display:flex;align-items:center;gap:6px;}
.progress-box{background:#0e0f10;border-radius:10px;padding:14px;border:1px solid var(--border);margin-bottom:10px;}
.progress-label-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;color:var(--text-dim);}
.progress-bar-bg{width:100%;height:8px;background:#1e293b;border-radius:4px;overflow:hidden;}
.progress-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent1),var(--accent2));border-radius:4px;transition:width 0.1s linear;}
.video-player-box{border-radius:12px;overflow:hidden;background:#000;position:relative;margin-top:12px;}
.video-player-box video{width:100%;max-height:450px;display:block;border-radius:12px;}
.download-video-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;font-size:14px;margin-top:12px;transition:0.2s;text-align:center;}
.download-video-btn:hover{filter:brightness(1.1);}

/* Code Blocks */
.code-container{background:#0a0a0b;border-radius:10px;border:1px solid var(--border);margin:14px 0;overflow:hidden;user-select:text;-webkit-user-select:text;}
.code-header{background:var(--bg-elev2);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-dim);border-bottom:1px solid var(--border);font-family:monospace;text-transform:uppercase;}
.copy-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border-radius:4px;}
.copy-btn:hover{background:#2a2d30;color:#fff;}
.code-container pre{padding:14px;margin:0;overflow-x:auto;}
.code-container code{font-family:'Courier New',monospace;font-size:13.5px;}
.inline-code{background:#252729;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13.5px;color:var(--gold);}

/* Input Footer */
.footer-container{padding:15px 15% calc(20px + env(safe-area-inset-bottom));flex-shrink:0;}
.input-wrapper{max-width:850px;margin:0 auto;display:flex;align-items:center;background:var(--bg-elev);border:1px solid var(--border);border-radius:28px;padding:6px 8px 6px 12px;gap:8px;}
.plus-btn{background:var(--bg-elev2);border:none;color:#38bdf8;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s;flex-shrink:0;}
.plus-btn:hover{background:#38bdf8;color:#0e0f10;}
#userInput{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15.5px;padding:8px 4px;user-select:text;-webkit-user-select:text;}
#userInput::placeholder{color:var(--text-dim);}
.send-btn{background:linear-gradient(135deg,var(--accent1),var(--accent3));border:none;color:#fff;cursor:pointer;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;}
.send-btn:hover{filter:brightness(1.1);}

/* Loading Animation */
.loading-stars{display:flex;gap:4px;padding-top:6px;}
.star{width:7px;height:7px;background:linear-gradient(135deg,var(--accent1),var(--accent2));border-radius:50%;animation:blink 1.4s infinite both;}
.star:nth-child(1){animation-delay:-.32s;} .star:nth-child(2){animation-delay:-.16s;}
@keyframes blink{0%,80%,100%{transform:scale(0);opacity:.5;}40%{transform:scale(1);opacity:1;}}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.modal-overlay.active{opacity:1;pointer-events:auto;}
.modal-card{background:var(--bg-elev);padding:26px;border-radius:18px;width:90%;max-width:390px;border:1px solid var(--border);display:flex;flex-direction:column;gap:14px;}
.modal-card h3{font-size:19px;font-weight:500;text-align:center;}
.modal-card p.sub{font-size:12.5px;color:var(--text-dim);text-align:center;margin-top:-8px;}
.modal-card input{background:#0e0f10;border:1px solid var(--border);border-radius:9px;padding:12px;color:#fff;font-size:14.5px;outline:none;user-select:text;-webkit-user-select:text;}
.modal-card input:focus{border-color:var(--accent1);}
.modal-card button.primary{background:linear-gradient(135deg,var(--accent1),var(--accent3));border:none;color:#fff;padding:12px;border-radius:9px;font-size:14.5px;font-weight:500;cursor:pointer;}
.modal-card button.primary:hover{filter:brightness(1.1);}
.close-modal{text-align:center;color:var(--text-dim);font-size:13px;cursor:pointer;}
.close-modal:hover{color:#fff;}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;}
.setting-row label{font-size:14px;color:var(--text-dim);}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.lang-pill{border:1px solid var(--border);background:#0e0f10;color:var(--text);padding:10px;border-radius:10px;cursor:pointer;text-align:center;font-size:13.5px;}
.lang-pill.active{border-color:var(--accent1);background:rgba(91,140,255,.12);color:#fff;}

.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:90;opacity:0;pointer-events:none;transition:opacity 0.3s ease;}
.sidebar-overlay.active{opacity:1;pointer-events:auto;}

@media (max-width:768px){
  aside{position:fixed;left:0;top:0;transform:translateX(-100%);}
  aside.open{transform:translateX(0);}
  .menu-btn{display:block;}
  .chat-container{padding-left:15px;padding-right:15px;}
  .footer-container{padding-left:15px;padding-right:15px;padding-bottom:calc(20px + env(safe-area-inset-bottom));}
  header{padding:16px 15px;}
}
</style>
</head>
<body>

<div class="app-container">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside id="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()"><span class="material-icons-outlined">add</span> <span id="t-newchat">New chat</span></button>
    <div class="history-title" id="t-recent">Recent Chats</div>
    <div class="history-section" id="chatList"></div>
    <div class="sidebar-bottom">
      <div class="sidebar-link" onclick="openSettingsModal()"><span class="material-icons-outlined" style="font-size:18px;">settings</span> <span id="t-settings">Settings</span></div>
    </div>
  </aside>

  <main id="mainContent">
    <header>
      <div style="display:flex;align-items:center;">
        <span class="material-icons-outlined menu-btn" onclick="toggleSidebar()">menu</span>
        <div class="brand" onclick="handleLogoTap()">
          <span class="material-icons-outlined" style="background:linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">auto_awesome</span>
          VIRU AI
        </div>
      </div>
      <div class="auth-status" id="authArea"></div>
    </header>

    <div class="chat-container" id="chatContainer"></div>

    <div class="footer-container">
      <div class="input-wrapper">
        <button class="plus-btn" onclick="handlePlusClick()" title="Generate AI Video (9:16)" type="button"><span class="material-icons-outlined">add</span></button>
        <input type="text" id="userInput" placeholder="Ask VIRU AI or type /video <prompt>..." onkeydown="checkEnter(event)" autocomplete="off">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" type="button"><span class="material-icons-outlined">send</span></button>
      </div>
    </div>
  </main>
</div>

<!-- Admin login modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-card">
    <h3 id="t-admintitle">Owner Authentication</h3>
    <p class="sub" id="t-adminsub">Restricted access</p>
    <input type="text" id="usernameInput" placeholder="Username" autocomplete="off">
    <input type="password" id="passwordInput" placeholder="Password">
    <button class="primary" onclick="handleLogin()" id="t-loginbtn" type="button">Login</button>
    <div class="close-modal" onclick="closeLoginModal()" id="t-cancel">Cancel</div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-card">
    <h3 id="t-settingstitle">Settings</h3>
    <div>
      <label style="font-size:13px;color:var(--text-dim);" id="t-langlabel">Language</label>
      <div class="lang-grid" style="margin-top:8px;">
        <div class="lang-pill" data-lang="si" onclick="setLanguage('si')">සිංහල</div>
        <div class="lang-pill" data-lang="en" onclick="setLanguage('en')">English</div>
        <div class="lang-pill" data-lang="ta" onclick="setLanguage('ta')">தமிழ்</div>
        <div class="lang-pill" data-lang="sg" onclick="setLanguage('sg')">Singlish</div>
      </div>
    </div>
    <div class="setting-row" id="ownerSettingsRow" style="display:none;">
      <label id="t-displayname">Display name</label>
      <input type="text" id="displayNameInput" placeholder="Viruna" style="max-width:140px;">
    </div>
    <button class="primary" onclick="saveSettings()" id="t-savebtn" type="button">Save</button>
    <div class="close-modal" onclick="closeSettingsModal()" id="t-close">Close</div>
  </div>
</div>

const SECRET_SEQUENCE = "admin";
let typedBuffer = "";
document.addEventListener("keydown", function(e){
  const active = document.activeElement;
  if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) return;
  if (e.key && e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {

function loadChatSession(id){

function deleteChat(id, event){
  event.stopPropagation();
  chatSessions = chatSessions.filter(c=>c.id!==id);
  if (activeChatId === id) activeChatId = chatSessions.length>0 ? chatSessions[0].id : null;
  saveState(); renderSidebar();

function startRename(id, event){
  event.stopPropagation();
  const item = document.querySelector(`.history-item[data-id="${id}"]`);
  const chat = chatSessions.find(c=>c.id===id);
  const titleSpan = item.querySelector(".title");
  const input = document.createElement("input");
  input.className = "rename-input";
  input.value = chat.title;
  titleSpan.replaceWith(input);
  input.focus(); input.select();
  function commit(){
    const val = input.value.trim() || chat.title;
    chat.title = val; saveState(); renderSidebar();
  }
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", e=>{
    if (e.key === "Enter") input.blur();
    if (e.key === "Escape") { input.value = chat.title; input.blur(); }
  });
  input.addEventListener("click", e=>e.stopPropagation());
}

function renderSidebar(){
  const listContainer = document.getElementById("chatList");
  listContainer.innerHTML = "";

    const isActive = chat.id === activeChatId ? "active" : "";

    item.dataset.id = chat.id;

    `;
    listContainer.appendChild(item);
  });
}

function parseMarkdown(text){
  if (!text) return "";
  let escaped = String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const codeBlockRegex = /```([a-zA-Z0-9_\-+]+)?\n([\s\S]*?)\n```/g;
  escaped = escaped.replace(codeBlockRegex, (match, lang, code)=>{
    const language = lang || 'code';
    return `</div><div class="code-container">
              <div class="code-header"><span>${language}</span>
                <button class="copy-btn" onclick="copyCode(this)" type="button"><span class="material-icons-outlined" style="font-size:16px;">content_copy</span> Copy</button>
              </div>
              <pre><code class="code-content">${code}</code></pre>
            </div><div class="message-text-block">`;
  });
  escaped = `<div class="message-text-block">${escaped}</div>`;
  escaped = escaped.replace(/<div class="message-text-block"><\/div>/g,'');
  escaped = escaped.replace(/`([^`]+)`/g,'<code class="inline-code">$1</code>');
  escaped = escaped.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return escaped;
}

function copyCode(button){
  const container = button.closest('.code-container');
  const codeText = container.querySelector('.code-content').innerText;
  navigator.clipboard.writeText(codeText).then(()=>{
    button.innerHTML = `<span class="material-icons-outlined" style="font-size:16px;">done</span> Copied!`;
    setTimeout(()=>{ button.innerHTML = `<span class="material-icons-outlined" style="font-size:16px;">content_copy</span> Copy`; }, 2000);
  });
}

function renderMessageUI(role, text){

  }
  container.appendChild(row);
}

async function handleVideoGeneration(videoPrompt) {
  let currentChat = chatSessions.find(c => c.id === activeChatId);
  if (!currentChat) {
    startNewChat();
    currentChat = chatSessions.find(c => c.id === activeChatId);
  }
  const container = document.getElementById("chatContainer");
  const cardId = "video_card_" + Date.now();

  const videoRow = document.createElement("div");
  videoRow.className = "chat-row ai-row";
  videoRow.innerHTML = `
    <div class="avatar ai-avatar"><span class="material-icons-outlined" style="font-size:20px;">movie</span></div>
    <div class="message-content">
      <div class="video-card" id="${cardId}">
        <div class="video-card-header">
          <div class="video-card-title"><span class="material-icons-outlined" style="font-size:17px;">auto_awesome</span> VIRU AI Video Generator</div>
          <span style="font-size:11px;background:#1e293b;padding:2px 8px;border-radius:6px;">9:16</span>
        </div>
        <div style="font-size:13px;margin-bottom:12px;color:var(--text);font-style:italic;">"${videoPrompt}"</div>
        
        <div class="progress-box" id="pbox_${cardId}">
          <div class="progress-label-row">
            <span id="pstatus_${cardId}">⚡ Initializing AI Neural Engine...</span>
            <span id="ppct_${cardId}" style="font-weight:bold;color:#38bdf8;">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="pfill_${cardId}"></div>
          </div>
          <div style="font-size:11px;color:var(--text-dim);margin-top:6px;text-align:right;" id="ptime_${cardId}">Generating video...</div>
        </div>

        <div id="pcontent_${cardId}"></div>
      </div>
    </div>`;
  container.appendChild(videoRow);
  scrollToBottom();

  let isComplete = false;
  let videoResult = null;
  let errorReason = null;

  let currentProgress = 0;
  const startTime = Date.now();

  const progressInterval = setInterval(() => {
    if (isComplete) return;

    const elapsed = Date.now() - startTime;
    if (currentProgress < 95) {
      currentProgress = Math.min(95, Math.floor((elapsed / 35000) * 95));
    }

    const pfill = document.getElementById(`pfill_${cardId}`);
    const ppct = document.getElementById(`ppct_${cardId}`);
    const ptime = document.getElementById(`ptime_${cardId}`);
    const pstatus = document.getElementById(`pstatus_${cardId}`);

    if (pfill) pfill.style.width = currentProgress + "%";
    if (ppct) ppct.innerText = currentProgress + "%";

    const remainingSec = Math.max(1, 45 - Math.floor(elapsed / 1000));
    if (ptime) ptime.innerText = `Estimated: ~${remainingSec}s`;

    if (currentProgress < 35 && pstatus) {
      pstatus.innerText = "⚡ Initializing AI Neural Engine...";
    } else if (currentProgress < 75 && pstatus) {
      pstatus.innerText = "🎬 Rendering 9:16 Video Frames...";
    } else if (currentProgress >= 75 && pstatus) {
      pstatus.innerText = "✨ Finalizing High-Res Output...";
    }
  }, 200);

  try {
    let data = null;
    try {
      const res = await fetch(`/api/video?prompt=${encodeURIComponent(videoPrompt)}`);
      if (res.ok) data = await res.json();
    } catch (e) {}

    if (!data || !data.video_url) {
      try {
        const vRes = await fetch(`https://video-genarator-api.vercel.app/api/generate?prompt=${encodeURIComponent(videoPrompt)}`);
        if (vRes.ok) data = await vRes.json();
      } catch (e) {}
    }

    if (data && (data.video_url || (data.data && data.data.result))) {
      videoResult = {
        video_url: data.video_url || data.data.result,
        download_url: data.download_url || data.video_url || data.data.result
      };
    } else {
      errorReason = (data && (data.error || data.message)) || "AI Engine failed to generate video";
    }

  } catch (err) {
    errorReason = "Network Error: " + err.message;
  }

  isComplete = true;
  clearInterval(progressInterval);

  const pfill = document.getElementById(`pfill_${cardId}`);
  const ppct = document.getElementById(`ppct_${cardId}`);
  const ptime = document.getElementById(`ptime_${cardId}`);
  const pstatus = document.getElementById(`pstatus_${cardId}`);
  const pbox = document.getElementById(`pbox_${cardId}`);
  const pcontent = document.getElementById(`pcontent_${cardId}`);

  if (videoResult && videoResult.video_url) {
    if (pfill) pfill.style.width = "100%";
    if (ppct) ppct.innerText = "100%";
    if (ptime) ptime.innerText = "Completed!";
    if (pstatus) pstatus.innerText = "🎉 Video Ready!";

    setTimeout(() => {
      if (pbox) pbox.style.display = "none";
      if (pcontent) {
        pcontent.innerHTML = `
          <div class="video-player-box">
            <video src="${videoResult.video_url}" controls autoplay loop playsinline></video>
          </div>
          <a href="${videoResult.download_url}" target="_blank" class="download-video-btn">
            <span class="material-icons-outlined" style="font-size:18px;">download</span> Download MP4 (9:16)
          </a>`;
      }

      if (currentChat) {
        currentChat.messages.push({
          type: "video",
          prompt: videoPrompt,
          video_url: videoResult.video_url,
          download_url: videoResult.download_url
        });
        saveState();
      }

      setTimeout(() => {
        const feedbackText = STRINGS[currentLang].videoFeedback;
        if (currentChat) {
          currentChat.messages.push({ role: "model", text: feedbackText });
          renderMessageUI("model", feedbackText);
          saveState();
          scrollToBottom();
        }
      }, 500);
    }, 400);

  } else {
    if (pbox) pbox.style.display = "none";
    if (pcontent) {
      pcontent.innerHTML = `<div style="color:#ef4444;font-size:13px;padding:10px 0;">⚠️ ${errorReason}</div>`;
    }
  }
  scrollToBottom();
}

// ===================== Send Message Router =====================
async function sendMessage(){
  const inputField = document.getElementById("userInput");
  const prompt = inputField.value.trim();
  if (!prompt) return;

  let currentChat = chatSessions.find(c => c.id === activeChatId);
  if (!currentChat) {
    startNewChat();
    currentChat = chatSessions.find(c => c.id === activeChatId);
  }
  if (!currentChat) return;

  if (currentChat.messages.length === 0){
    currentChat.title = prompt.length > 24 ? prompt.substring(0, 24) + "..." : prompt;
    renderSidebar();
  }
  
  currentChat.messages.push({role:"user", text:prompt});
  renderMessageUI("user", prompt);
  inputField.value = "";
  saveState(); scrollToBottom();

  const lowerPrompt = prompt.toLowerCase();
  let videoPrompt = null;

  if (lowerPrompt.startsWith("/video ")) {
    videoPrompt = prompt.substring(7).trim();
  } else if (lowerPrompt.startsWith("video ekak hadapan ") || lowerPrompt.startsWith("video ekak oni ") || lowerPrompt.startsWith("video ekak ona ")) {
    videoPrompt = prompt.replace(/^(video ekak hadapan|video ekak oni|video ekak ona)\s*/i, "").trim();
  } else if (lowerPrompt.startsWith("generate video ") || lowerPrompt.startsWith("make video ") || lowerPrompt.startsWith("create video ")) {
    videoPrompt = prompt.replace(/^(generate video|make video|create video)\s*/i, "").trim();
  }

  if (videoPrompt && videoPrompt.length > 2) {
    handleVideoGeneration(videoPrompt);
    return;
  }

  // Rate Limiting
  if (!isOwnerLoggedIn) {
    const now = new Date();
    const currentMin = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate() + ' ' + now.getHours() + ':' + now.getMinutes();
    const currentDay = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();

    let savedMin = localStorage.getItem("viru_min_timestamp");
    let savedDay = localStorage.getItem("viru_day_timestamp");
    let countMin = parseInt(localStorage.getItem("viru_msg_count_min") || "0");
    let countDay = parseInt(localStorage.getItem("viru_msg_count_day") || "0");

    if (savedMin !== currentMin) { countMin = 0; localStorage.setItem("viru_min_timestamp", currentMin); }
    if (savedDay !== currentDay) { countDay = 0; localStorage.setItem("viru_day_timestamp", currentDay); }

    if (countMin >= 8 || countDay >= 80) {
      const limitMessage = STRINGS[currentLang].limitMsg;
      currentChat.messages.push({role: "model", text: limitMessage});
      renderMessageUI("model", limitMessage);
      saveState(); scrollToBottom();
      return;
    }

    localStorage.setItem("viru_msg_count_min", countMin + 1);
    localStorage.setItem("viru_msg_count_day", countDay + 1);
  }

  const container = document.getElementById("chatContainer");
  const loadingRow = document.createElement("div");
  loadingRow.className = "chat-row ai-row";
  loadingRow.innerHTML = `
    <div class="avatar ai-avatar"><span class="material-icons-outlined" style="font-size:20px;">auto_awesome</span></div>
    <div class="message-content"><div class="loading-stars"><div class="star"></div><div class="star"></div><div class="star"></div></div></div>`;
  container.appendChild(loadingRow);
  scrollToBottom();

  const historyPayload = currentChat.messages
    .filter(m => m.type !== "video")
    .map(msg=>({ role: msg.role==="user" ? "user" : "model", parts: [{text: msg.text}] }));

  try {
    const response = await fetch(CLOUDFLARE_CHAT_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization": authToken ? `Bearer ${authToken}` : ""
      },
      body: JSON.stringify({ historyPayload, isOwnerLoggedIn, lang: currentLang })
    });
    const data = await response.json();
    loadingRow.remove();

    if (data.reply){
      currentChat.messages.push({role:"model", text:data.reply});
      renderMessageUI("model", data.reply);
      saveState();
    } else if (data.error){
      renderMessageUI("model", `${STRINGS[currentLang].errOccurred} ${data.error}`);
    }
    scrollToBottom();
  } catch(err){
    loadingRow.remove();
    renderMessageUI("model", STRINGS[currentLang].networkErr);
    scrollToBottom();
  }
}

// ===================== Admin Authentication =====================
function openLoginModal(){ document.getElementById("loginModal").classList.add("active"); document.getElementById("usernameInput").focus(); }
function closeLoginModal(){ document.getElementById("loginModal").classList.remove("active"); }

async function handleLogin(){
  const user = document.getElementById("usernameInput").value.trim();
  const pass = document.getElementById("passwordInput").value.trim();
  const btn = document.getElementById("t-loginbtn");

  if (!user || !pass) return;

  btn.innerText = "Authenticating...";
  btn.disabled = true;

  try {
    const res = await fetch(CLOUDFLARE_AUTH_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass })
    });
    const result = await res.json();

    if (result.success && result.token) {
      isOwnerLoggedIn = true;
      displayName = result.displayName || "Viruna";
      authToken = result.token;

      localStorage.setItem("viru_is_owner", true);
      localStorage.setItem("viru_auth_token", authToken);
      localStorage.setItem("viru_display_name", displayName);

      closeLoginModal();
      updateAuthUI();
      document.getElementById("usernameInput").value = "";
      document.getElementById("passwordInput").value = "";
      loadChatSession(activeChatId);
    } else {
      alert(STRINGS[currentLang].wrongCreds);
    }
  } catch (err) {
    alert("Authentication failed: Network Error");
  } finally {
    btn.innerText = STRINGS[currentLang].loginbtn;
    btn.disabled = false;
  }
}

function handleLogout(){
  isOwnerLoggedIn = false;
  authToken = "";
  localStorage.setItem("viru_is_owner", false);
  localStorage.removeItem("viru_auth_token");
  updateAuthUI();
  loadChatSession(activeChatId);
}

function updateAuthUI(){
  const authArea = document.getElementById("authArea");
  const s = STRINGS[currentLang];
  if (isOwnerLoggedIn){
    authArea.innerHTML = `
      <div class="owner-badge"><span class="material-icons-outlined" style="font-size:16px;">workspace_premium</span> ${s.ownerMode}</div>
      <button class="icon-only-btn" onclick="handleLogout()" title="${s.logout}" type="button"><span class="material-icons-outlined" style="font-size:18px;">logout</span></button>
    `;
  } else {
    authArea.innerHTML = "";
  }
}

function openSettingsModal(){
  closeSidebar();
  document.getElementById("settingsModal").classList.add("active");
  document.getElementById("ownerSettingsRow").style.display = isOwnerLoggedIn ? "flex" : "none";
  document.getElementById("displayNameInput").value = displayName;
}
function closeSettingsModal(){ document.getElementById("settingsModal").classList.remove("active"); }
function saveSettings(){
  if (isOwnerLoggedIn){
    const val = document.getElementById("displayNameInput").value.trim();
    if (val){ displayName = val; localStorage.setItem("viru_display_name", displayName); }
  }
  closeSettingsModal();
  loadChatSession(activeChatId);
}

function saveState(){
  localStorage.setItem("viru_chat_sessions", JSON.stringify(chatSessions));
  localStorage.setItem("viru_active_chat_id", activeChatId);
}
function scrollToBottom(){
  const container = document.getElementById("chatContainer");
  container.scrollTop = container.scrollHeight;
}
function checkEnter(event){ 
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
}
</script>
</body>
</html>
